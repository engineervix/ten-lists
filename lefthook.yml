pre-commit:
  commands:
    eslint:
      glob: "*.{js,mjs,cjs}"
      run: npx eslint {staged_files}
      stage_fixed: true
    stylelint:
      glob: "*.{scss,css}"
      run: npx stylelint {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{js,mjs,cjs,scss,css,html,json,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
